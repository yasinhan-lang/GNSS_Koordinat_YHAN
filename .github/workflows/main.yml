name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk GNSS_Koordinat_YHAN.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: GNSS_Koordinat_YHAN_APK
          path: GNSS_Koordinat_YHAN.apk
